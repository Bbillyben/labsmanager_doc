# Project
site_url: https://labsmanager-doc.readthedocs.io
site_name: LabsManager Documentation
site_description: LabsManager - open source science lab management
site_author: Bbillyben

# Theme
theme:
  name: material
  logo: assets/icon.png
  favicon: assets/favicon.png
  custom_dir: docs/.overrides
  palette:
    scheme: default
    primary: custom
    accent: custom
  features:
    - content.code.copy
    - navigation.sections
    - navigation.top

extra_css:
  - css/base.css
  - css/labsmanager.css

markdown_extensions:
  - attr_list
  - md_in_html
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  # for icon emoji fontawesome
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  # for code higlight
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
      use_pygments: true
      linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets


plugins:
  - search
  - i18n:
      docs_structure: suffix
      languages:
        - locale: en
          name: English
          default: true
        - locale: fr
          name: Français
          nav_translations:
            User Guide: Guide utilisateur
            Getting started: Premiers pas
            Finding information: Trouver une information
            People: Personnes
            Projects: Projets
            Projects and contracts: Projets et contrats
            Leave: Absences
            People and responsibilities: Personnes et responsabilités
            Tasks and milestones: Tâches et jalons
            Project calendar: Calendrier du projet
            Finance: Finances
            View a fund: Consulter un financement
            Budgets and expenses: Budgets et dépenses
            Fund explorer: Explorateur de fonds
            Dashboards: Tableaux de bord
            Use your dashboard: Utiliser son tableau de bord
            Customize your dashboard: Personnaliser son tableau de bord
            Calendars: Calendriers
            Use the calendars: Utiliser les calendriers
            Teams: Équipes
            Find and view teams: Trouver et consulter les équipes
            Manage team members: Gérer les membres d’une équipe
            Organizations: Organisations
            Find and view organizations: Trouver et consulter les organisations
            Reports and exports: Rapports et exports
            Generate reports: Générer des rapports
            Settings and preferences: Réglages et préférences
            Manage your settings: Gérer ses réglages
            Tools: Outils
            Use the tools: Utiliser les outils
            Admin: Administration
            Instance administration: Administration de l’instance
            Administer an instance: Administrer une instance
            Maintain reference lists: Gérer les listes de référence
            Review data consistency: Examiner la cohérence des données
            Installation: Installation
            Installation overview: Présentation de l’installation
            Docker Compose: Docker Compose
            Bare metal: Installation sans Docker
            Initial setup and demo data: Initialisation et données de démonstration

